function esc(s){return String(s==null?&#x27;&#x27;:s).replace(/[&amp;&lt;&gt;&quot;]/g,c=&gt;({&#x27;&amp;&#x27;:&#x27;&amp;amp;&#x27;,&#x27;&lt;&#x27;:&#x27;&amp;lt;&#x27;,&#x27;&gt;&#x27;:&#x27;&amp;gt;&#x27;,&#x27;&quot;&#x27;:&#x27;&amp;quot;&#x27;}[c]))}
function set(k){R[k]=k===&#x27;pw&#x27;?+document.getElementById(k).value:document.getElementById(k).value;
  if(k===&#x27;fs&#x27;)R[k]=+R[k];if(k===&#x27;lh&#x27;)R[k]=+R[k];render()}
function saveBasic(){R.basic={name:val(&#x27;pName&#x27;),phone:val(&#x27;pPhone&#x27;),mail:val(&#x27;pMail&#x27;),link:val(&#x27;pLink&#x27;)};render();toast(&#x27;已保存&#x27;)}
function val(id){return document.getElementById(id).value.trim()}
/* ============ 表达库 ============ */
let expOpen=null;
function renderExps(){
  document.getElementById(&#x27;expList&#x27;).innerHTML=R.exps.map(e=&gt;`
  &lt;div class=&quot;exp&quot;&gt;&lt;div style=&quot;display:flex;justify-content:space-between;align-items:center&quot;&gt;
  &lt;span&gt;&lt;b&gt;${esc(e.org)}&lt;/b&gt; &lt;span class=&quot;co&quot;&gt;${esc(e.role)} · ${esc(e.time)}&lt;/span&gt;&lt;/span&gt;
  &lt;span&gt;&lt;button class=&quot;btn mini&quot; onclick=&quot;toggleExp(&#x27;${e.id}&#x27;)&quot;&gt;${expOpen===e.id?&#x27;收起&#x27;:&#x27;展开(&#x27;+e.variants.length+&#x27;种说法)&#x27;}&lt;/button&gt;
  &lt;button class=&quot;btn mini&quot; onclick=&quot;delExp(&#x27;${e.id}&#x27;)&quot;&gt;×&lt;/button&gt;&lt;/span&gt;&lt;/div&gt;
  &lt;div class=&quot;co&quot;&gt;${esc((e.variants.find(v=&gt;v.id===e.active)||e.variants[0]||{}).text||&#x27;&#x27;)}&lt;/div&gt;
  ${expOpen===e.id?`&lt;div style=&quot;margin-top:8px&quot;&gt;
    &lt;div class=&quot;frow&quot;&gt;&lt;label&gt;机构&lt;/label&gt;&lt;input onchange=&quot;updExp(&#x27;${e.id}&#x27;,&#x27;org&#x27;,this.value)&quot; value=&quot;${esc(e.org)}&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;frow&quot;&gt;&lt;label&gt;职位&lt;/label&gt;&lt;input onchange=&quot;updExp(&#x27;${e.id}&#x27;,&#x27;role&#x27;,this.value)&quot; value=&quot;${esc(e.role)}&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;frow&quot;&gt;&lt;label&gt;地点/时间&lt;/label&gt;&lt;div style=&quot;display:flex;gap:6px&quot;&gt;&lt;input onchange=&quot;updExp(&#x27;${e.id}&#x27;,&#x27;loc&#x27;,this.value)&quot; value=&quot;${esc(e.loc||&#x27;&#x27;)}&quot;&gt;&lt;input onchange=&quot;updExp(&#x27;${e.id}&#x27;,&#x27;time&#x27;,this.value)&quot; value=&quot;${esc(e.time)}&quot;&gt;&lt;/div&gt;&lt;/div&gt;
    ${e.variants.map(va=&gt;`&lt;label class=&quot;var ${e.active===va.id?&#x27;active&#x27;:&#x27;&#x27;}&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;act-${e.id}&quot; ${e.active===va.id?&#x27;checked&#x27;:&#x27;&#x27;} onchange=&quot;setActive(&#x27;${e.id}&#x27;,&#x27;${va.id}&#x27;)&quot;&gt;
    &lt;span class=&quot;vtext&quot; contenteditable onblur=&quot;updVar(&#x27;${e.id}&#x27;,&#x27;${va.id}&#x27;,this.textContent)&quot;&gt;${esc(va.text)}&lt;/span&gt;
    &lt;button class=&quot;btn mini&quot; onclick=&quot;delVar(&#x27;${e.id}&#x27;,&#x27;${va.id}&#x27;)&quot;&gt;×&lt;/button&gt;&lt;/label&gt;`).join(&#x27;&#x27;)}
    &lt;div class=&quot;addv&quot;&gt;&lt;input id=&quot;nv-${e.id}&quot; placeholder=&quot;新表述：投不同方向用不同说法&quot;&gt;&lt;button class=&quot;btn mini primary&quot; onclick=&quot;addVar(&#x27;${e.id}&#x27;)&quot;&gt;加入表达库&lt;/button&gt;&lt;/div&gt;
  &lt;/div&gt;`:&#x27;&#x27;}&lt;/div&gt;`).join(&#x27;&#x27;)}
function toggleExp(id){expOpen=expOpen===id?null:id;renderExps()}
function addExp(){R.exps.push({id:&#x27;e&#x27;+Date.now(),org:&#x27;新经历&#x27;,role:&#x27;职位&#x27;,loc:&#x27;&#x27;,time:&#x27;&#x27;,variants:[{id:&#x27;v&#x27;+Date.now(),text:&#x27;描述…&#x27;}],active:&#x27;v&#x27;+Date.now()});expOpen=R.exps[R.exps.length-1].id;render()}
function delExp(id){if(!confirm(&#x27;删除这条经历及全部表述？&#x27;))return;R.exps=R.exps.filter(e=&gt;e.id!==id);render()}
function updExp(id,k,val){R.exps.find(e=&gt;e.id===id)[k]=val;render()}
function setActive(eid,vid){R.exps.find(e=&gt;e.id===eid).active=vid;render()}
function addVar(eid){const t=val(&#x27;nv-&#x27;+eid);if(!t)return;const e=R.exps.find(x=&gt;x.id===eid);const v={id:&#x27;v&#x27;+Date.now(),text:t};e.variants.push(v);e.active=v.id;render();toast(&#x27;已加入表达库并设为当前表述&#x27;)}
function delVar(eid,vid){const e=R.exps.find(x=&gt;x.id===eid);if(e.variants.length&lt;=1)return toast(&#x27;至少保留一条表述&#x27;);e.variants=e.variants.filter(v=&gt;v.id!==vid);if(e.active===vid)e.active=e.variants[0].id;render()}
function updVar(eid,vid,text){const v=R.exps.find(x=&gt;x.id===eid).variants.find(v=&gt;v.id===vid);v.text=text.trim();renderPaper();save()}
/* ============ 版本 ============ */
function saveVersion(){
  const company=prompt(&#x27;保存给哪家公司？&#x27;,&#x27;安踏&#x27;);if(!company)return;
  const job=prompt(&#x27;岗位名称？&#x27;,&#x27;活动运营实习生&#x27;);if(!job)return;
  const snapshot=JSON.stringify({lang:R.lang,fs:R.fs,lh:R.lh,mg:R.mg,dv:R.dv,dc:R.dc,pw:R.pw,exps:R.exps.map(e=&gt;({...e,active:e.active}))});
  R.versions.unshift({id:&#x27;ver&#x27;+Date.now(),company,job,date:new Date().toLocaleString(&#x27;zh-CN&#x27;),snapshot});
  save();renderVersions();toast(&#x27;已存版本&#x27;)}
function renderVersions(){
  document.getElementById(&#x27;verList&#x27;).innerHTML=R.versions.map(v=&gt;`&lt;div class=&quot;exp&quot;&gt;&lt;div style=&quot;display:flex;justify-content:space-between&quot;&gt;
  &lt;span&gt;&lt;b&gt;${esc(v.company)}&lt;/b&gt; &lt;span class=&quot;co&quot;&gt;${esc(v.job)} · ${esc(v.date)}&lt;/span&gt;&lt;/span&gt;
  &lt;span&gt;&lt;button class=&quot;btn mini&quot; onclick=&quot;loadVersion(&#x27;${v.id}&#x27;)&quot;&gt;载入&lt;/button&gt;&lt;button class=&quot;btn mini&quot; onclick=&quot;delVersion(&#x27;${v.id}&#x27;)&quot;&gt;×&lt;/button&gt;&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;`).join(&#x27;&#x27;)||&#x27;&lt;div class=&quot;co&quot;&gt;暂无版本——排版调好后点右上角「保存为版本」&lt;/div&gt;&#x27;}
function loadVersion(id){const v=R.versions.find(x=&gt;x.id===id);Object.assign(R,JSON.parse(v.snapshot));render();toast(&#x27;已载入该版本&#x27;)}
function delVersion(id){R.versions=R.versions.filter(v=&gt;v.id!==id);renderVersions();save()}
/* ============ 导入导出 ============ */
function exportAll(){const a=document.createElement(&#x27;a&#x27;);a.href=&#x27;data:application/json;charset=utf-8,&#x27;+encodeURIComponent(JSON.stringify(R,null,2));a.download=&#x27;resume-workbench-&#x27;+new Date().toISOString().slice(0,10)+&#x27;.json&#x27;;a.click()}
function importAll(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=&gt;{try{R=Object.assign(JSON.parse(JSON.stringify(DEFAULT)),JSON.parse(r.result));render();toast(&#x27;导入成功&#x27;)}catch(x){toast(&#x27;格式错误&#x27;)}};r.readAsText(f)}
render();
