.stat .num{font-size:22px;font-weight:600}
.stat .lbl{font-size:12px;color:var(--sub)}
.kanban{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
.kcol{background:#f0f2f5;border-radius:10px;padding:8px;min-height:120px}
.kcol h3{font-size:12px;color:var(--sub);margin-bottom:8px;display:flex;justify-content:space-between}
.kcard{background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px;margin-bottom:8px;font-size:12px;cursor:pointer}
.kcard:hover{border-color:var(--blue)}
.kcard b{display:block;font-size:12.5px}
.kcard .co{color:var(--sub);font-size:11px}
.kcard.over{border-left:3px solid var(--red)}
.health-ok{color:var(--green)} .health-warn{color:var(--orange)} .health-bad{color:var(--red)}
.todo-item{display:flex;align-items:center;gap:10px;padding:7px 4px;border-bottom:1px solid var(--line)}
.todo-item.done span.txt{text-decoration:line-through;color:var(--sub)}
.todo-item input[type=checkbox]{width:16px;height:16px;accent-color:var(--green)}
.badge{background:var(--red);color:#fff;font-size:10px;border-radius:10px;padding:0 5px;margin-left:4px}
.muted{color:var(--sub);font-size:12px}
.searchbar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.searchbar input,.searchbar select{min-width:130px}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;align-items:flex-start;justify-content:center;overflow:auto;padding:40px 16px}
.modal.open{display:flex}
.mbox{background:#fff;border-radius:14px;padding:20px;width:720px;max-width:100%}
.mbox h3{font-size:15px;margin-bottom:14px}
.frow{display:grid;grid-template-columns:110px 1fr;gap:10px;align-items:start;margin-bottom:10px}
.frow label{font-size:12.5px;color:var(--sub);padding-top:7px;text-align:right}
.frow input,.frow select{width:100%}
.mfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
.interview-card{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px;cursor:pointer}
.interview-card:hover{border-color:var(--purple)}
.interview-card b{font-size:13.5px}
.sec{margin-top:8px}.sec .st{font-size:12px;color:var(--purple);font-weight:600;margin-bottom:2px}
.chip{display:inline-block;background:#f0f2f5;border-radius:6px;padding:2px 8px;font-size:11.5px;margin:2px 4px 2px 0}
.empty{text-align:center;color:var(--sub);padding:30px 0;font-size:13px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1c1e21;color:#fff;padding:8px 18px;border-radius:20px;font-size:13px;display:none;z-index:200}
@media (max-width:860px){.grid2,.grid3,.grid4{grid-template-columns:1fr}.kanban{grid-template-columns:repeat(2,1fr)}}

  const card=document.createElement('div');card.className='day';
  const w=WD[(wd0+d-18)%7];
  let h='<div class="day-h"><span class="d">9月'+d+'日</span><span class="w">'+w+'</span>'+(ds===TODAY?'<span class="today-tag">今天</span>':'')+'</div>';
  if(!shown.length){h+='<div class="empty-day">—— 无排期任务（缓冲/留白）——</div>';}
  else shown.forEach(t=>{
    const isCont=!isStart(t)&&t.start!==t.due;
    const span=t.start!==t.due?(' · '+t.start.slice(5).replace('-','/')+' → '+t.due.slice(5).replace('-','/')):'';
    const st=t.status==='进行中'?'<span class="st st-doing">进行中</span>':t.status.includes('等待反馈')?'<span class="st st-wait">'+t.status+'</span>':t.status&&t.status!=='未开始'?'<span class="st st-todo">'+t.status+'</span>':'';
    h+='<div class="task"><span class="badge '+(t.pri||'NP')+'">'+(t.pri||'—')+'</span><span class="mod">'+(t.module||'')+'</span><div class="t-title">'+(isCont?'<span style="color:#86909c">↳ </span>':'')+t.title+(span?'<div class="t-meta">跨度'+span+(t.cost?' · 预估 '+t.cost:'')+'</div>':(t.cost?'<div class="t-meta">预估 '+t.cost+'</div>':''))+'</div>'+st+'</div>';
  });
  card.innerHTML=h;days.appendChild(card);
}
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));b.classList.add('on');
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('on'));
  document.getElementById(b.dataset.p).classList.add('on');
}));
</script>
</body>
