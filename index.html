  if(never.length)out.push({level:&#x27;warn&#x27;,msg:`${never.length} 家公司从未核实过（种子数据）：${never.slice(0,5).map(c=&gt;c.name).join(&#x27;、&#x27;)}${never.length&gt;5?&#x27;…&#x27;:&#x27;&#x27;}`});

.btn:hover{border-color:var(--blue);color:var(--blue)}
.btn.primary{background:var(--blue);color:#fff;border-color:var(--blue)}
.wrap{display:grid;grid-template-columns:420px 1fr;gap:18px;max-width:1400px;margin:0 auto;padding:18px}
@media(max-width:1000px){.wrap{grid-template-columns:1fr}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:14px}
.panel h2{font-size:14px;font-weight:600;margin-bottom:10px}
.tabs{display:flex;gap:4px;margin-bottom:10px;flex-wrap:wrap}
.tabs button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:4px 10px;font-size:12px;cursor:pointer}
.tabs button.active{background:#e8f0fe;color:var(--blue);border-color:var(--blue)}
.frow{display:grid;grid-template-columns:88px 1fr;gap:8px;align-items:center;margin-bottom:8px}
.frow label{font-size:12px;color:var(--sub);text-align:right}
input,select,textarea{border:1px solid var(--line);border-radius:7px;padding:5px 8px;font-size:12.5px;font-family:inherit;width:100%}
textarea{resize:vertical}
.exp{border:1px solid var(--line);border-radius:9px;padding:9px;margin-bottom:9px}
.exp b{font-size:12.5px}
.exp .co{color:var(--sub);font-size:11.5px}
.var{display:flex;gap:6px;align-items:flex-start;padding:6px;border-radius:7px;margin-top:5px}
.var:hover{background:#f7f8fa}
.var.active{background:#e8f0fe}
.var input[type=radio]{margin-top:4px;accent-color:var(--blue);flex-shrink:0}
.var .vtext{flex:1;font-size:12px;line-height:1.55}
.mini{font-size:11px;padding:2px 8px}
.addv{display:flex;gap:6px;margin-top:6px}
